[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "ssdp"
readme = "README.md"
keywords = [ "asyncio", "iot", "python", "ssdp", "upnp" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]
dynamic = [ "description", "version" ]
optional-dependencies.cli = [
  "click",
  "pygments",
]
optional-dependencies.pygments = [ "pygments" ]
urls.Changelog = "https://github.com/codingjoe/ssdp/releases"
urls.Project-URL = "https://github.com/codingjoe/ssdp"
scripts.ssdp = "ssdp:__main__.ssdp"
entry-points."pygments.lexers".ssdp = "ssdp.lexers:SSDPLexer"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools_scm]
write_to = "ssdp/_version.py"

[tool.flit]
module.name = "ssdp"

[tool.ruff]
src = [ "ssdp", "tests" ]
lint.select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [ "B904", "D1", "E501", "S101" ]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --tb=short -rxs"

[tool.coverage]
run.source = [ "ssdp" ]
report.show_missing = true
