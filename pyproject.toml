[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "ssdp"
readme = "README.md"
keywords = [ "asyncio", "iot", "python", "ssdp", "upnp" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]
dynamic = [ "description", "version" ]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.optional-dependencies]
cli = [
  "click",
  "pygments",
]
pygments = [ "pygments" ]
[project.urls]
Changelog = "https://github.com/codingjoe/ssdp/releases"
Project-URL = "https://github.com/codingjoe/ssdp"
[project.scripts]
ssdp = "ssdp:__main__.ssdp"
[project.entry-points]
"pygments.lexers".ssdp = "ssdp.lexers:SSDPLexer"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools_scm]
write_to = "ssdp/_version.py"

[tool.flit]
[tool.flit.module]
name = "ssdp"

[tool.ruff]
src = [ "ssdp", "tests" ]
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "pep257"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]
addopts = "--cov --tb=short -rxs"

[tool.coverage]
[tool.coverage.run]
source = [ "ssdp" ]
[tool.coverage.report]
show_missing = true
